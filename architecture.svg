<svg width="1000" height="850" viewBox="0 0 1000 850" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="850" fill="#F8FAFC"/>
  
  <!-- Presentation Layer -->
  <rect x="50" y="40" width="900" height="120" rx="10" fill="white" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="70" y="70" font-family="Arial" font-size="14" font-weight="bold" fill="#64748B">PRESENTATION LAYER (Hapi API Gateway)</text>
  
  <rect x="70" y="85" width="180" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="160" y="115" font-family="Arial" font-size="12" font-weight="bold" fill="#1E40AF" text-anchor="middle">Quote Plugin</text>
  
  <rect x="270" y="85" width="180" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="360" y="115" font-family="Arial" font-size="12" font-weight="bold" fill="#1E40AF" text-anchor="middle">Admin Plugin</text>
  
  <rect x="470" y="85" width="180" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="560" y="115" font-family="Arial" font-size="12" font-weight="bold" fill="#1E40AF" text-anchor="middle">S3Hook Plugin</text>
  
  <rect x="670" y="85" width="180" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="760" y="115" font-family="Arial" font-size="12" font-weight="bold" fill="#1E40AF" text-anchor="middle">Proxy Plugin</text>

  <!-- Messaging Layer -->
  <rect x="50" y="180" width="900" height="60" rx="30" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="500" y="215" font-family="Arial" font-size="16" font-weight="bold" fill="#5B21B6" text-anchor="middle">EVENT BUS (Redis Pub/Sub)</text>

  <!-- Worker Layer -->
  <rect x="50" y="260" width="900" height="440" rx="10" fill="white" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="70" y="290" font-family="Arial" font-size="14" font-weight="bold" fill="#64748B">WORKER LAYER (Ephemeral Processing)</text>
  
  <!-- Row 1: Processors, Aggregators, Business Logic -->
  <rect x="70" y="310" width="280" height="120" rx="6" fill="#FFF7ED" stroke="#F97316"/>
  <text x="85" y="330" font-family="Arial" font-size="11" font-weight="bold" fill="#9A3412">Processors</text>
  <text x="85" y="355" font-family="Arial" font-size="12" fill="#431407">• Form Processor</text>
  <text x="85" y="380" font-family="Arial" font-size="12" fill="#431407">• 2D Processor (CB/Retry)</text>
  <text x="85" y="405" font-family="Arial" font-size="12" fill="#431407">• 3D Processor (CB/Retry)</text>

  <rect x="360" y="310" width="280" height="120" rx="6" fill="#FFF7ED" stroke="#F97316"/>
  <text x="375" y="330" font-family="Arial" font-size="11" font-weight="bold" fill="#9A3412">Aggregators</text>
  <text x="375" y="355" font-family="Arial" font-size="12" fill="#431407">• Part Completion</text>
  <text x="375" y="380" font-family="Arial" font-size="12" fill="#431407">• Quote Completion</text>
  <text x="375" y="405" font-family="Arial" font-size="11" font-weight="bold" fill="#9A3412" font-style="italic">(25s DB-backed timer)</text>

  <rect x="650" y="310" width="285" height="120" rx="6" fill="#FFF7ED" stroke="#F97316"/>
  <text x="665" y="330" font-family="Arial" font-size="11" font-weight="bold" fill="#9A3412">Business Logic</text>
  <text x="665" y="355" font-family="Arial" font-size="12" fill="#431407">• Rules Engine (Internal)</text>
  <text x="665" y="385" font-family="Arial" font-size="12" fill="#431407">• Calculation Service (External)</text>

  <!-- Row 2: Generators, Output, Bridge -->
  <rect x="70" y="450" width="280" height="100" rx="6" fill="#FFF7ED" stroke="#F97316"/>
  <text x="85" y="470" font-family="Arial" font-size="11" font-weight="bold" fill="#9A3412">Generators</text>
  <text x="85" y="495" font-family="Arial" font-size="12" fill="#431407">• PDF Generator</text>

  <rect x="360" y="450" width="280" height="100" rx="6" fill="#FFF7ED" stroke="#F97316"/>
  <text x="375" y="470" font-family="Arial" font-size="11" font-weight="bold" fill="#9A3412">Output</text>
  <text x="375" y="495" font-family="Arial" font-size="12" fill="#431407">• Email Worker (SMTP)</text>
  <text x="375" y="520" font-family="Arial" font-size="12" fill="#431407">• Notification Service (WS)</text>

  <rect x="650" y="450" width="285" height="100" rx="6" fill="#FFF7ED" stroke="#F97316"/>
  <text x="665" y="470" font-family="Arial" font-size="11" font-weight="bold" fill="#9A3412">Bridge</text>
  <text x="665" y="495" font-family="Arial" font-size="12" fill="#431407">• S3 Event Bridge</text>

  <!-- Row 3: Persistence -->
  <rect x="70" y="570" width="865" height="110" rx="6" fill="#F0FDF4" stroke="#22C55E"/>
  <text x="500" y="595" font-family="Arial" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">Mongo Persister</text>
  <text x="500" y="625" font-family="Arial" font-size="12" fill="#14532D" text-anchor="middle">SINGLE DATABASE WRITER</text>
  <text x="500" y="650" font-family="Arial" font-size="11" fill="#14532D" text-anchor="middle">Decouples processing from DB bottlenecks &amp; ensures transactional integrity</text>

  <!-- Infrastructure -->
  <rect x="50" y="720" width="900" height="100" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="70" y="745" font-family="Arial" font-size="14" font-weight="bold" fill="#475569">INFRASTRUCTURE</text>
  
  <rect x="70" y="755" width="260" height="50" rx="6" fill="#F0F9FF" stroke="#0EA5E9"/>
  <text x="200" y="785" font-family="Arial" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">S3 / Minio (Storage)</text>
  
  <rect x="345" y="755" width="260" height="50" rx="6" fill="#F0FDF4" stroke="#22C55E"/>
  <text x="475" y="785" font-family="Arial" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">MongoDB (State/Data)</text>
  
  <rect x="620" y="755" width="315" height="50" rx="6" fill="#FEF2F2" stroke="#EF4444"/>
  <text x="777" y="785" font-family="Arial" font-size="12" font-weight="bold" fill="#991B1B" text-anchor="middle">Redis (Events / DLQ)</text>

  <!-- Flow Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8" />
    </marker>
  </defs>
  
  <!-- Presentation to Bus -->
  <path d="M500 160 L500 180" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Bus to Worker Groups -->
  <path d="M500 240 L500 260" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Worker to Persistence -->
  <path d="M500 680 L500 720" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
  
</svg>
